name: Lab4 C Build and Test

on:
  push:
    branches:
      - Lab4
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build C program
        run: make -C L4/590MakefileLab

      - name: Run C program
        run: make -C L4/590MakefileLab run

      - name: Verify output
        run: |
          output=$(./L4/590MakefileLab/program)
          echo "$output"
          echo "$output" | grep -q "55"
          echo "$output" | grep -q "1.618034"
