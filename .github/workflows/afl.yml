name: AFL++ Fuzzing

on:
  pull_request:

jobs:
  afl-fuzz:
    runs-on: ubuntu-latest
    continue-on-error: true
    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AFL++
        run: |
          sudo apt-get update
          sudo apt-get install -y afl++

      - name: Compile dvcp
        run: |
          afl-cc dvcp.c -o dvcp

      - name: Prepare AFL++ input
        run: |
          mkdir -p input
          echo "test" > input/test.txt

      - name: Configure core dump handling
        run: |
          sudo sysctl -w kernel.core_pattern=core

      - name: Run AFL++ for 3 minutes
        run: |
          set +e
          timeout 180 afl-fuzz -i input -o output -- ./dvcp @@
          STATUS=$?

          if [ "$STATUS" -eq 124 ]; then
            echo "AFL++ completed its 3-minute fuzzing window."
            exit 0
          fi

          exit "$STATUS"


