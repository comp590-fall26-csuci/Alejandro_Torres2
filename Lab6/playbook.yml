- name: Configuring Debian VM
  hosts: local
  become: true

  tasks:
    - name: Install asciinema
      ansible.builtin.apt:
       name: asciinema
       state: present
       update_cache: true
    - name: Install Apache2
      ansible.builtin.apt:
       name: apache2
       state: present
    - name: Enable apache2 service
      ansible.builtin.service:
       name: apache2
       enabled: true
       state: started
    - name: Show debug message
      ansible.builtin.debug:
       msg: "Configuration debug complete."
